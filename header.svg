<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes shimmer {
					0% { background-position: 0% 50%; }
					50% { background-position: 100% 50%; }
					100% { background-position: 0% 50%; }
				}
				@keyframes float {
					0%, 100% { transform: translateY(0px); }
					50% { transform: translateY(-6px); }
				}
				@keyframes fadeUp {
					0% { opacity: 0; transform: translateY(12px); }
					100% { opacity: 1; transform: translateY(0); }
				}
				@keyframes orb1 {
					0%, 100% { transform: translate(0, 0) scale(1); }
					33% { transform: translate(40px, -30px) scale(1.1); }
					66% { transform: translate(-20px, 20px) scale(0.95); }
				}
				@keyframes orb2 {
					0%, 100% { transform: translate(0, 0) scale(1); }
					33% { transform: translate(-50px, 20px) scale(1.05); }
					66% { transform: translate(30px, -40px) scale(1.1); }
				}
				@keyframes orb3 {
					0%, 100% { transform: translate(0, 0) scale(1); }
					33% { transform: translate(25px, 35px) scale(1.08); }
					66% { transform: translate(-35px, -15px) scale(0.97); }
				}
				.scene {
					width: 100%;
					height: 100%;
					margin: 0;
					padding: 0;
					display: flex;
					align-items: center;
					justify-content: center;
					background: #0a0a0f;
					border-radius: 10px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
				}
				/* Ambient colour orbs */
				.orb {
					position: absolute;
					border-radius: 50%;
					filter: blur(80px);
					opacity: 0.5;
				}
				.orb-1 {
					width: 300px;
					height: 300px;
					background: #6366f1;
					top: -80px;
					left: -60px;
					animation: orb1 12s ease-in-out infinite;
				}
				.orb-2 {
					width: 250px;
					height: 250px;
					background: #06b6d4;
					bottom: -60px;
					right: -40px;
					animation: orb2 14s ease-in-out infinite;
				}
				.orb-3 {
					width: 200px;
					height: 200px;
					background: #a78bfa;
					top: 50%;
					left: 50%;
					margin-top: -100px;
					margin-left: -100px;
					animation: orb3 16s ease-in-out infinite;
				}
				/* Noise grain overlay */
				.grain {
					position: absolute;
					inset: 0;
					opacity: 0.03;
					background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
					background-size: 128px 128px;
				}
				/* Glass card */
				.glass {
					position: relative;
					z-index: 1;
					background: rgba(255, 255, 255, 0.06);
					border: 1px solid rgba(255, 255, 255, 0.12);
					border-radius: 20px;
					padding: 40px 56px;
					text-align: center;
					animation: float 6s ease-in-out infinite;
					box-shadow:
						0 8px 32px rgba(0, 0, 0, 0.3),
						inset 0 1px 0 rgba(255, 255, 255, 0.1);
				}
				.glass h1 {
					font-size: 36px;
					font-weight: 600;
					letter-spacing: -0.5px;
					color: rgba(255, 255, 255, 0.95);
					margin: 0 0 14px 0;
					animation: fadeUp 0.8s ease both;
				}
				.glass p {
					font-size: 15px;
					font-weight: 400;
					line-height: 1.6;
					color: rgba(255, 255, 255, 0.55);
					margin: 0;
					animation: fadeUp 0.8s ease 0.15s both;
					max-width: 420px;
				}
				.glass .link {
					display: inline-block;
					margin-top: 20px;
					font-size: 14px;
					font-weight: 500;
					color: rgba(255, 255, 255, 0.8);
					background: rgba(255, 255, 255, 0.08);
					border: 1px solid rgba(255, 255, 255, 0.1);
					border-radius: 100px;
					padding: 8px 22px;
					letter-spacing: 0.3px;
					animation: fadeUp 0.8s ease 0.3s both;
				}
			</style>
			<div class="scene">
				<div class="orb orb-1"></div>
				<div class="orb orb-2"></div>
				<div class="orb orb-3"></div>
				<div class="grain"></div>
				<div class="glass">
					<h1>Hi 👋🏻</h1>
					<p>Welcome to my GitHub. Not sure how you ended up here, but while you're at it, fancy a look at my site?</p>
					<span class="link">thomas-tong.com →</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
