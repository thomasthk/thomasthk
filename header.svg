<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGradient" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#020024" />
      <stop offset="50%" stop-color="#0f0f3d" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>

    <!-- Orb blur filter -->
    <filter id="orbBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <!-- Glass card shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>

    <!-- Subtle inner glow for glass edge -->
    <linearGradient id="glassBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)" />
    </linearGradient>

    <!-- Glass fill -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>

    <!-- Pill button fill -->
    <linearGradient id="pillFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="400" rx="10" fill="url(#bgGradient)" />

  <!-- Ambient orbs -->
  <circle cx="80" cy="60" r="150" fill="#6366f1" filter="url(#orbBlur)" opacity="0.45">
    <animate attributeName="cx" values="80;120;60;80" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="60;30;90;60" dur="12s" repeatCount="indefinite" />
  </circle>

  <circle cx="700" cy="340" r="130" fill="#06b6d4" filter="url(#orbBlur)" opacity="0.4">
    <animate attributeName="cx" values="700;660;720;700" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="340;360;300;340" dur="14s" repeatCount="indefinite" />
  </circle>

  <circle cx="400" cy="200" r="110" fill="#a78bfa" filter="url(#orbBlur)" opacity="0.35">
    <animate attributeName="cx" values="400;430;375;400" dur="16s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200;235;180;200" dur="16s" repeatCount="indefinite" />
  </circle>

  <!-- Glass card -->
  <g filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="6s" repeatCount="indefinite" />

    <!-- Card background -->
    <rect x="175" y="75" width="450" height="250" rx="20" fill="url(#glassFill)" />

    <!-- Card border -->
    <rect x="175" y="75" width="450" height="250" rx="20" fill="none" stroke="url(#glassBorder)" stroke-width="1" />

    <!-- Hi heading -->
    <text x="400" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="42" font-weight="600" fill="rgba(255,255,255,0.95)" letter-spacing="-0.5">Hi there</text>

    <!-- Body text line 1 -->
    <text x="400" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.5)">Welcome to my GitHub. Not sure how you ended up here,</text>

    <!-- Body text line 2 -->
    <text x="400" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.5)">but while you're at it, fancy a look at my site?</text>

    <!-- Pill button -->
    <rect x="305" y="232" width="190" height="40" rx="20" fill="url(#pillFill)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="400" y="257" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.8)" letter-spacing="0.3">thomas-tong.com →</text>
  </g>
</svg>
